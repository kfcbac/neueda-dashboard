<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CEO Dashboard">
<meta name="theme-color" content="#1e2d3d">
<title>Neueda CEO Dashboard</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --navy:#1e2d3d;--blue:#1a5fa8;--orange:#E8450A;--amber:#EF9F27;
  --bg:#ffffff;--bg2:#f7f8fa;--bg3:#eef0f4;
  --text:#1a1a2e;--text2:#4a5568;--text3:#8a93a2;
  --border:#e2e6ed;--border2:#cdd2da;
  --rag-r:#E24B4A;--rag-r-bg:#FCEBEB;--rag-r-text:#A32D2D;
  --rag-a:#EF9F27;--rag-a-bg:#FAEEDA;--rag-a-text:#854F0B;
  --rag-g:#639922;--rag-g-bg:#EAF3DE;--rag-g-text:#3B6D11;
  --radius:10px;--radius-sm:6px;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#0f1923;--bg2:#1a2535;--bg3:#222f3e;--text:#e8edf3;--text2:#8fa3bc;--text3:#506070;--border:#2a3a4a;--border2:#3a4f62;}
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
button,input,select,textarea{font-family:inherit;}

.header{background:var(--navy);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.header-logo{display:flex;align-items:center;gap:10px;}
.header-title{color:#fff;font-size:16px;font-weight:600;}
.header-week{color:rgba(255,255,255,0.5);font-size:11px;margin-top:1px;}
.header-actions{display:flex;gap:8px;align-items:center;}
.btn-icon{background:rgba(255,255,255,0.1);border:none;color:#fff;border-radius:var(--radius-sm);padding:7px 12px;font-size:12px;display:flex;align-items:center;gap:5px;cursor:pointer;transition:background 0.15s;}
.btn-icon:hover{background:rgba(255,255,255,0.2);}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#639922;display:inline-block;margin-right:4px;transition:background 0.3s;}
.sync-dot.syncing{background:#EF9F27;animation:pulse 1s infinite;}
.sync-dot.error{background:#E24B4A;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}

.summary-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px 20px;background:var(--bg2);border-bottom:1px solid var(--border);}
.summary-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px;text-align:center;}
.summary-label{font-size:11px;color:var(--text3);margin-bottom:4px;}
.summary-value{font-size:22px;font-weight:700;line-height:1;}

.nav-tabs{display:flex;gap:0;padding:0 20px;background:var(--bg);border-bottom:1px solid var(--border);overflow-x:auto;}
.nav-tab{padding:12px 16px;font-size:13px;color:var(--text2);border:none;background:none;border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;transition:all 0.15s;}
.nav-tab.active{color:var(--orange);border-bottom-color:var(--orange);font-weight:500;}

.main{padding:20px;max-width:1200px;margin:0 auto;}

.wheel-layout{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:start;}
.wheel-col{display:flex;flex-direction:column;gap:12px;}
.wheel-center{display:flex;flex-direction:column;align-items:center;gap:8px;}
.wheel-hint{font-size:11px;color:var(--text3);text-align:center;}
.fn-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:border-color 0.15s;}
.fn-card:hover{border-color:var(--border2);}
.fn-card-header{padding:8px 12px;display:flex;align-items:center;justify-content:space-between;}
.fn-card-title{color:#fff;font-size:12px;font-weight:600;}
.fn-table{width:100%;border-collapse:collapse;}
.fn-table td{padding:5px 10px;font-size:12px;border-bottom:1px solid var(--border);color:var(--text);}
.fn-table tr:last-child td{border-bottom:none;}
.fn-table .num{color:var(--text3);width:18px;font-size:11px;}
.fn-update{padding:5px 10px 8px;font-size:11px;color:var(--text2);border-top:1px solid var(--border);background:var(--bg2);}

.rag-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0;}
.rag-R{background:var(--rag-r);}
.rag-A{background:var(--rag-a);}
.rag-G{background:var(--rag-g);}
.rag-pill{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;}
.rag-pill-R{background:var(--rag-r-bg);color:var(--rag-r-text);}
.rag-pill-A{background:var(--rag-a-bg);color:var(--rag-a-text);}
.rag-pill-G{background:var(--rag-g-bg);color:var(--rag-g-text);}

.runway-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
.runway-filters{display:flex;gap:6px;flex-wrap:wrap;}
.filter-chip{padding:4px 12px;font-size:12px;border:1px solid var(--border);border-radius:20px;background:var(--bg);color:var(--text2);cursor:pointer;transition:all 0.15s;}
.filter-chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.swimlane{margin-bottom:24px;}
.swimlane-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.runway-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.strategy-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:border-color 0.15s,box-shadow 0.15s;}
.strategy-card:hover{border-color:var(--border2);box-shadow:0 2px 8px rgba(0,0,0,0.07);}
.strategy-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px;}
.strategy-card-name{font-size:13px;font-weight:500;color:var(--text);line-height:1.4;flex:1;}
.strategy-card-meta{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
.owner-avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#fff;flex-shrink:0;}
.progress-wrap{margin:8px 0 4px;}
.progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-bottom:4px;}
.progress-track{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;border-radius:3px;transition:width 0.3s;}
.type-badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500;}
.type-initiative{background:#E6F1FB;color:#0C447C;}
.type-okr{background:#EEEDFE;color:#3C3489;}
.type-quarterly{background:#FAEEDA;color:#854F0B;}
.empty-lane{font-size:13px;color:var(--text3);padding:12px;text-align:center;border:1px dashed var(--border);border-radius:var(--radius);}

.action-item{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;}
.action-item.done{opacity:0.5;}
.action-item.done .action-main{text-decoration:line-through;}
.btn-del{background:none;border:none;color:var(--text3);font-size:16px;padding:2px 4px;border-radius:4px;cursor:pointer;}
.btn-del:hover{color:var(--rag-r);background:var(--rag-r-bg);}
.section-head{font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin:16px 0 8px;}
.empty-state{text-align:center;padding:40px 20px;color:var(--text3);font-size:14px;}

.deadline-item{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:8px;}
.deadline-bar{width:4px;border-radius:2px;align-self:stretch;min-height:36px;flex-shrink:0;}

.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
@media(min-width:600px){.modal-backdrop{align-items:center;}}
.modal-sheet{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:580px;max-height:90vh;overflow-y:auto;padding:20px;position:relative;}
@media(min-width:600px){.modal-sheet{border-radius:var(--radius);margin:20px;}}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 16px;}
.modal-title{font-size:16px;font-weight:600;margin-bottom:16px;}
.form-group{margin-bottom:14px;}
.form-label{font-size:12px;color:var(--text2);margin-bottom:5px;display:block;font-weight:500;}
.form-input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;background:var(--bg);color:var(--text);outline:none;transition:border-color 0.15s;}
.form-input:focus{border-color:var(--blue);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn-primary{background:var(--navy);color:#fff;border:none;border-radius:var(--radius-sm);padding:10px 20px;font-size:14px;font-weight:500;cursor:pointer;transition:background 0.15s;}
.btn-primary:hover{background:var(--blue);}
.btn-secondary{background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 20px;font-size:14px;cursor:pointer;transition:background 0.15s;}
.btn-secondary:hover{background:var(--bg3);}
.btn-danger{background:var(--rag-r-bg);color:var(--rag-r-text);border:1px solid var(--rag-r);border-radius:var(--radius-sm);padding:10px 20px;font-size:14px;cursor:pointer;}
.btn-row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
.modal-close{position:absolute;top:16px;right:16px;background:var(--bg2);border:none;border-radius:50%;width:28px;height:28px;font-size:16px;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.progress-slider{width:100%;accent-color:var(--navy);}

.owner-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;margin-top:6px;}
.owner-option{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all 0.15s;background:var(--bg);}
.owner-option:hover{border-color:var(--border2);background:var(--bg2);}
.owner-option.selected{border-color:var(--navy);background:#E6F1FB;}
.owner-option span{font-size:10px;color:var(--text2);text-align:center;line-height:1.2;}

.loading-row{display:flex;align-items:center;gap:8px;color:var(--text2);font-size:13px;padding:12px 0;}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin 0.7s linear infinite;}
.spinner-lg{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto;}
@keyframes spin{to{transform:rotate(360deg);}}

.fab{position:fixed;bottom:24px;right:24px;background:var(--orange);color:#fff;border:none;border-radius:50%;width:52px;height:52px;font-size:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:40;box-shadow:0 4px 12px rgba(232,69,10,0.4);transition:transform 0.15s;}
.fab:hover{transform:scale(1.05);}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--navy);flex-shrink:0;margin-top:2px;cursor:pointer;}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;z-index:200;opacity:0;transition:opacity 0.3s;pointer-events:none;}
.toast.show{opacity:1;}

@media(max-width:700px){
  .wheel-layout{grid-template-columns:1fr;}
  .wheel-center{order:-1;}
  .summary-bar{grid-template-columns:repeat(2,1fr);}
  .main{padding:12px;}
  .form-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-logo">
    <svg width="26" height="20" viewBox="0 0 26 20" aria-hidden="true">
      <rect x="0" y="0" width="9" height="3.5" fill="#E8450A"/>
      <rect x="0" y="0" width="3.5" height="13" fill="#E8450A"/>
      <rect x="17" y="16.5" width="9" height="3.5" fill="#E8450A"/>
      <rect x="22.5" y="7" width="3.5" height="13" fill="#E8450A"/>
    </svg>
    <div>
      <div class="header-title">CEO dashboard</div>
      <div class="header-week" id="weekLabel"></div>
    </div>
  </div>
  <div class="header-actions">
    <span id="syncStatus" title="Sync status"><span class="sync-dot" id="syncDot"></span></span>
    <button class="btn-icon" onclick="openAI()">&#10024; Extract notes</button>
  </div>
</header>

<div class="summary-bar" id="summaryBar"></div>

<nav class="nav-tabs">
  <button class="nav-tab active" onclick="setView('wheel',this)">Focus wheel</button>
  <button class="nav-tab" onclick="setView('strategy',this)">Strategy</button>
  <button class="nav-tab" onclick="setView('actions',this)">Actions</button>
  <button class="nav-tab" onclick="setView('deadlines',this)">Deadlines</button>
</nav>

<div class="main">
  <div id="viewWheel"></div>
  <div id="viewStrategy" style="display:none;"></div>
  <div id="viewActions" style="display:none;"></div>
  <div id="viewDeadlines" style="display:none;"></div>
</div>

<button class="fab" id="fab" onclick="handleFab()" aria-label="Add item">+</button>
<div class="toast" id="toast"></div>

<!-- Function modal -->
<div id="fnModal" style="display:none;">
  <div class="modal-backdrop" onclick="if(event.target===this)closeFnModal()">
    <div class="modal-sheet"><div class="modal-handle"></div>
      <button class="modal-close" onclick="closeFnModal()">&#10005;</button>
      <div id="fnModalContent"></div>
    </div>
  </div>
</div>

<!-- Add action modal -->
<div id="addModal" style="display:none;">
  <div class="modal-backdrop" onclick="if(event.target===this)closeAddModal()">
    <div class="modal-sheet"><div class="modal-handle"></div>
      <button class="modal-close" onclick="closeAddModal()">&#10005;</button>
      <div class="modal-title">Add action</div>
      <div class="form-group"><label class="form-label">Business function</label><select class="form-input" id="addFn"></select></div>
      <div class="form-group"><label class="form-label">Action</label><input type="text" class="form-input" id="addText" placeholder="Describe the action..."></div>
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Due date</label><input type="date" class="form-input" id="addDue"></div>
        <div class="form-group"><label class="form-label">Priority</label><select class="form-input" id="addPriority"><option>High</option><option selected>Medium</option><option>Low</option></select></div>
      </div>
      <div class="form-group" style="max-width:50%;"><label class="form-label">RAG</label><select class="form-input" id="addRag"><option value="G">Green</option><option value="A">Amber</option><option value="R">Red</option></select></div>
      <div class="btn-row"><button class="btn-secondary" onclick="closeAddModal()">Cancel</button><button class="btn-primary" onclick="saveAddAction()">Save action</button></div>
    </div>
  </div>
</div>

<!-- Strategy modal -->
<div id="strategyModal" style="display:none;">
  <div class="modal-backdrop" onclick="if(event.target===this)closeStrategyModal()">
    <div class="modal-sheet"><div class="modal-handle"></div>
      <button class="modal-close" onclick="closeStrategyModal()">&#10005;</button>
      <div class="modal-title" id="strategyModalTitle">Add strategy item</div>
      <div class="form-group"><label class="form-label">Name</label><input type="text" class="form-input" id="sName" placeholder="Initiative or goal name..."></div>
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Type</label>
          <select class="form-input" id="sType">
            <option value="initiative">Strategic initiative</option>
            <option value="okr">OKR</option>
            <option value="quarterly">Quarterly priority</option>
          </select>
        </div>
        <div class="form-group"><label class="form-label">RAG status</label>
          <select class="form-input" id="sRag">
            <option value="G">Green — on track</option>
            <option value="A">Amber — attention</option>
            <option value="R">Red — at risk</option>
          </select>
        </div>
      </div>
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Due date</label><input type="date" class="form-input" id="sDue"></div>
        <div class="form-group"><label class="form-label">Priority</label><select class="form-input" id="sPriority"><option>High</option><option selected>Medium</option><option>Low</option></select></div>
      </div>
      <div class="form-group">
        <label class="form-label">Progress — <span id="progressVal">0</span>%</label>
        <input type="range" class="progress-slider" id="sProgress" min="0" max="100" value="0" step="5" oninput="document.getElementById('progressVal').textContent=this.value">
      </div>
      <div class="form-group"><label class="form-label">Owner</label><div class="owner-grid" id="ownerGrid"></div></div>
      <div class="form-group"><label class="form-label">Notes</label><textarea class="form-input" id="sNotes" rows="2" placeholder="Any context or update..."></textarea></div>
      <div class="btn-row">
        <button class="btn-secondary" onclick="closeStrategyModal()">Cancel</button>
        <button id="sDeleteBtn" class="btn-danger" style="display:none;" onclick="deleteCurrentStrategy()">Delete</button>
        <button class="btn-primary" onclick="saveStrategyItem()">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- AI modal -->
<div id="aiModal" style="display:none;">
  <div class="modal-backdrop" onclick="if(event.target===this)closeAI()">
    <div class="modal-sheet"><div class="modal-handle"></div>
      <button class="modal-close" onclick="closeAI()">&#10005;</button>
      <div class="modal-title">&#10024; Extract actions from notes</div>
      <p style="font-size:13px;color:var(--text2);margin-bottom:12px;">Paste raw notes from your Supernote or meetings. Actions will be extracted and assigned to the right function automatically.</p>
      <textarea class="form-input" id="aiNotes" rows="7" placeholder="Paste your notes here..." style="resize:vertical;"></textarea>
      <button class="btn-primary" id="extractBtn" onclick="runExtract()" style="margin-top:10px;width:100%;">Extract actions</button>
      <div id="aiResults" style="margin-top:14px;"></div>
    </div>
  </div>
</div>

<script>
// ─── CONFIG ───────────────────────────────────────────────
const SUPABASE_URL='https://wrlrwrypadzietsfgysz.supabase.co';
const SUPABASE_KEY='sb_publishable_juy5SyvGqGW1aIWvfOEIdg_uLUfXXTi';
const HEADERS={'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Prefer':'return=representation'};

// ─── CONSTANTS ────────────────────────────────────────────
const FNS=[
  {id:'sales',label:'Sales & BD',color:'#1a5fa8'},
  {id:'delivery',label:'Delivery & Ops',color:'#1e2d3d'},
  {id:'finance',label:'Finance',color:'#E8450A'},
  {id:'people',label:'People & HR',color:'#1a5fa8'},
  {id:'marketing',label:'Marketing',color:'#1e2d3d'},
  {id:'tech',label:'Technology',color:'#E8450A'}
];
const TEAM=[
  {id:'kc',name:'Kevin',initials:'KC',color:'#1a5fa8'},
  {id:'t1',name:'Helen',initials:'HE',color:'#639922'},
  {id:'t2',name:'Orlaith',initials:'OR',color:'#E8450A'},
  {id:'t3',name:'Brendan',initials:'BR',color:'#1e2d3d'},
  {id:'t4',name:'Frank',initials:'FR',color:'#EF9F27'},
  {id:'t5',name:'David',initials:'DA',color:'#533AB7'},
  {id:'t6',name:'Alan',initials:'AL',color:'#0F6E56'},
  {id:'t7',name:'Fran',initials:'FN',color:'#993C1D'}
];
const TYPE_LABELS={initiative:'Strategic initiative',okr:'OKR',quarterly:'Quarterly priority'};
const TYPE_CLASSES={initiative:'type-initiative',okr:'type-okr',quarterly:'type-quarterly'};

// ─── STATE ────────────────────────────────────────────────
let state={rags:{},updates:{},actions:[],strategy:[]};
let currentView='wheel';
let editFnId=null;
let editStrategyId=null;
let strategyFilter='all';
let selectedOwner=null;
let syncTimer=null;

// ─── SUPABASE HELPERS ─────────────────────────────────────
async function sbGet(table){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}?select=*`,{headers:HEADERS});
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}
async function sbUpsert(table,row){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}`,{method:'POST',headers:{...HEADERS,'Prefer':'resolution=merge-duplicates,return=representation'},body:JSON.stringify(row)});
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}
async function sbDelete(table,id){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`,{method:'DELETE',headers:HEADERS});
  if(!r.ok)throw new Error(await r.text());
}

function setSyncStatus(status){
  const dot=document.getElementById('syncDot');
  dot.className='sync-dot'+(status==='syncing'?' syncing':status==='error'?' error':'');
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// ─── LOAD FROM SUPABASE ───────────────────────────────────
async function loadFromSupabase(){
  setSyncStatus('syncing');
  try{
    // Ensure tables exist by attempting to load — will fail gracefully if not set up yet
    const [ragRows,actionRows,strategyRows]=await Promise.all([
      sbGet('ceo_rags'),sbGet('ceo_actions'),sbGet('ceo_strategy')
    ]);
    // Rags & updates
    FNS.forEach(f=>{state.rags[f.id]='G';state.updates[f.id]='';});
    ragRows.forEach(r=>{state.rags[r.fn_id]=r.rag||'G';state.updates[r.fn_id]=r.update_text||'';});
    // Actions
    state.actions=actionRows.map(r=>({id:r.id,fn:r.fn,text:r.text,due:r.due||'',priority:r.priority||'Medium',rag:r.rag||'G',done:r.done||false}));
    // Strategy
    state.strategy=strategyRows.map(r=>({id:r.id,name:r.name,type:r.type||'initiative',rag:r.rag||'G',due:r.due||'',priority:r.priority||'Medium',progress:r.progress||0,owner:r.owner||null,notes:r.notes||''}));
    setSyncStatus('ok');
    render();
  }catch(e){
    setSyncStatus('error');
    // Fall back to localStorage
    try{const s=localStorage.getItem('neueda_ceo_v4');if(s){const ls=JSON.parse(s);state={...state,...ls};}}catch(le){}
    FNS.forEach(f=>{if(!state.rags[f.id])state.rags[f.id]='G';if(!state.updates[f.id])state.updates[f.id]='';});
    if(!state.actions)state.actions=[];
    if(!state.strategy)state.strategy=[];
    showToast('Offline — using local data');
    render();
  }
}

// ─── UTILS ────────────────────────────────────────────────
function weekLabel(){
  const n=new Date(),s=new Date(n);s.setDate(n.getDate()-n.getDay()+1);
  const e=new Date(s);e.setDate(s.getDate()+6);
  const f=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  return`Week of ${f(s)} — ${f(e)}`;
}
function daysUntil(ds){if(!ds)return null;const d=new Date(ds),n=new Date();n.setHours(0,0,0,0);d.setHours(0,0,0,0);return Math.round((d-n)/86400000);}
function dlLabel(d){if(d===null)return'';if(d<0)return`Overdue ${Math.abs(d)}d`;if(d===0)return'Due today';if(d===1)return'Tomorrow';return`${d}d`;}
function dlColor(d){if(d===null)return'var(--text3)';if(d<=0||d<=3)return'var(--rag-r)';if(d<=7)return'var(--rag-a)';return'var(--rag-g)';}
function progressColor(p){if(p>=75)return'var(--rag-g)';if(p>=40)return'var(--rag-a)';return'var(--rag-r)';}
function uid(){return Date.now()+Math.random().toString(36).slice(2,7);}

function renderSummary(){

  document.getElementById('summaryBar').innerHTML=`

    <div class="summary-card"><div class="summary-label">Attention</div><div class="summary-value" style="color:${c.A>0?'var(--rag-a)':'var(--text)'};">${c.A}</div></div>

    <div class="summary-card"><div class="summary-label">Strategy items</div><div class="summary-value">${strat}</div></div>`;
}

// ─── WHEEL ────────────────────────────────────────────────
function drawWheel(){
  const cx=110,cy=110,r=92,inner=40,slices=FNS.length,angle=2*Math.PI/slices,gap=0.05;
  let h=`<svg width="220" height="220" viewBox="0 0 220 220" style="cursor:pointer;">`;
  h+=`<circle cx="${cx}" cy="${cy}" r="${inner}" fill="#1e2d3d"/>`;
  h+=`<text x="${cx}" y="${cy-5}" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">neueda</text>`;
  h+=`<rect x="${cx+5}" y="${cy+3}" width="14" height="2.5" fill="#E8450A" rx="1"/>`;
  h+=`<rect x="${cx+5}" y="${cy+3}" width="2.5" height="9" fill="#E8450A" rx="1"/>`;
  h+=`<rect x="${cx+14}" y="${cy+9.5}" width="2.5" height="2.5" fill="#E8450A" rx="1"/>`;
  FNS.forEach((f,i)=>{
    const s=-Math.PI/2+i*angle+gap/2,e=-Math.PI/2+(i+1)*angle-gap/2;
    const x1=cx+r*Math.cos(s),y1=cy+r*Math.sin(s),x2=cx+r*Math.cos(e),y2=cy+r*Math.sin(e);
    const xi1=cx+inner*Math.cos(s),yi1=cy+inner*Math.sin(s),xi2=cx+inner*Math.cos(e),yi2=cy+inner*Math.sin(e);
    const rag=state.rags[f.id]||'G';
    const rc=rag==='R'?'#E24B4A':rag==='A'?'#EF9F27':'#639922';
    const mid=(s+e)/2,lx=cx+(r-20)*Math.cos(mid),ly=cy+(r-20)*Math.sin(mid);
    const olx=cx+(r+10)*Math.cos(mid),oly=cy+(r+10)*Math.sin(mid);
    h+=`<path d="M${xi1},${yi1} L${x1},${y1} A${r},${r} 0 0,1 ${x2},${y2} L${xi2},${yi2} A${inner},${inner} 0 0,0 ${xi1},${yi1}" fill="${f.color}" onclick="openFnModal('${f.id}')" style="opacity:0.93;"/>`;
    h+=`<circle cx="${olx}" cy="${oly}" r="5" fill="${rc}"/>`;
    h+=`<text x="${lx}" y="${ly+4}" text-anchor="middle" fill="#fff" font-size="9.5" font-weight="500" pointer-events="none">${f.label.split(' & ')[0].split(' ')[0]}</text>`;
  });
  return h+'</svg>';
}
function fnCard(f){
  const actions=state.actions.filter(a=>a.fn===f.id&&!a.done);
  const update=state.updates[f.id]||'';
  const rows=Array.from({length:4},(_,i)=>{
    const a=actions[i];
    if(!a)return`<tr><td class="num">${i+1}</td><td style="color:var(--text3);font-size:11px;">—</td><td></td></tr>`;
    return`<tr><td class="num">${i+1}</td><td>${a.text.length>28?a.text.slice(0,26)+'…':a.text}</td><td><span class="rag-dot rag-${a.rag||'G'}" style="margin:auto;display:block;"></span></td></tr>`;
  }).join('');
  return`<div class="fn-card" onclick="openFnModal('${f.id}')">
    <div class="fn-card-header" style="background:${f.color};">
      <span class="fn-card-title">${f.label}</span>
      <span class="rag-pill rag-pill-${state.rags[f.id]||'G'}">${state.rags[f.id]||'G'}</span>
    </div>
    <table class="fn-table"><tbody>${rows}</tbody></table>
    ${update?`<div class="fn-update">${update}</div>`:''}
  </div>`;}
function renderWheel(){
  document.getElementById('viewWheel').innerHTML=`
    <div class="wheel-layout">
      <div class="wheel-col">${FNS.slice(0,3).map(f=>fnCard(f)).join('')}</div>
      <div class="wheel-center">${drawWheel()}<div class="wheel-hint">Tap a segment or card to update</div></div>
      <div class="wheel-col">${FNS.slice(3,6).map(f=>fnCard(f)).join('')}</div>
    </div>`;}

function renderStrategy(){

  let html=`<div class="runway-header">

function setStrategyFilter(f){strategyFilter=f;renderStrategy();}

// ─── ACTIONS VIEW ─────────────────────────────────────────
function renderActions(){
  const open=state.actions.filter(a=>!a.done).sort((a,b)=>new Date(a.due||'9999')-new Date(b.due||'9999'));
  const done=state.actions.filter(a=>a.done);
  let html='';
  if(!open.length&&!done.length){html='<div class="empty-state">No actions yet.<br>Tap + to add one.</div>';}
  else{
    if(open.length){html+=`<div class="section-head">Open (${open.length})</div>`;
      html+=open.map(a=>{const f=FNS.find(x=>x.id===a.fn);const days=daysUntil(a.due);
        return`<div class="action-item"><input type="checkbox" onchange="toggleAction('${a.id}')">

    if(done.length){html+=`<div class="section-head">Completed (${done.length})</div>`;
      html+=done.map(a=>`<div class="action-item done"><input type="checkbox" checked onchange="toggleAction('${a.id}')">

        <button class="btn-del" onclick="deleteAction('${a.id}')">&#215;</button>

  document.getElementById('viewActions').innerHTML=html;
}

// ─── DEADLINES VIEW ───────────────────────────────────────
function renderDeadlines(){
  const all=[
    ...state.actions.filter(a=>!a.done&&a.due).map(a=>({...a,_type:'action'})),
    ...state.strategy.filter(s=>s.due).map(s=>({...s,_type:'strategy',text:s.name}))
  ].sort((a,b)=>new Date(a.due)-new Date(b.due));
  if(!all.length){document.getElementById('viewDeadlines').innerHTML='<div class="empty-state">No upcoming deadlines.</div>';return;}
  document.getElementById('viewDeadlines').innerHTML=all.map(a=>{
    const days=daysUntil(a.due);
    const bc=days<=0||days<=3?'var(--rag-r)':days<=7?'var(--rag-a)':'var(--rag-g)';
    const label=a._type==='strategy'?`Strategy · ${TYPE_LABELS[a.type]||''}`:FNS.find(x=>x.id===a.fn)?.label||a.fn;
    return`<div class="deadline-item">
      <div class="deadline-bar" style="background:${bc};"></div>

        <div style="font-size:13px;font-weight:500;">${a.text||a.name}</div>
        <div style="font-size:11px;color:var(--text3);margin-top:2px;">${label} · ${new Date(a.due).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</div>
      </div>
      <div style="font-size:12px;font-weight:600;color:${bc};">${dlLabel(days)}</div>
    </div>`;}).join('');}

  const notes=document.getElementById('aiNotes').value.trim();if(!notes)return;
  const btn=document.getElementById('extractBtn');btn.disabled=true;
  document.getElementById('aiResults').innerHTML='<div class="loading-row"><div class="spinner"></div>Extracting actions…</div>';
  const fnList=FNS.map(f=>`${f.id}: ${f.label}`).join('\n');
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:`Extract action items from these notes. Return ONLY valid JSON, no markdown.\n{"actions":[{"text":"...","fn":"function_id","priority":"High|Medium|Low","due":"YYYY-MM-DD or null","rag":"G|A|R"}]}\nFunctions:\n${fnList}\nNotes:\n${notes}`}]})});
    const data=await res.json();
    const raw=data.content.map(c=>c.text||'').join('').replace(/```json|```/g,'').trim();
    const parsed=JSON.parse(raw);const actions=parsed.actions||[];
    if(!actions.length){document.getElementById('aiResults').innerHTML='<p style="font-size:13px;color:var(--text2);padding:8px 0;">No clear actions found. Try more detailed notes.</p>';}
    else{document.getElementById('aiResults').innerHTML=`
      <p style="font-size:13px;font-weight:500;margin:12px 0 8px;">${actions.length} action${actions.length>1?'s':''} found:</p>
      ${actions.map((a,i)=>{const f=FNS.find(x=>x.id===a.fn)||FNS[0];return`<div style="display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);">
        <input type="checkbox" id="ai_${i}" checked>
        <div style="flex:1;"><div style="font-size:13px;">${a.text}</div>
        <div style="font-size:11px;color:var(--text3);margin-top:2px;">${f.label} · ${a.priority||'Medium'}${a.due?' · '+new Date(a.due).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):''}</div></div>
        <span class="rag-pill rag-pill-${a.rag||'G'}">${a.rag||'G'}</span>
      </div>`;}).join('')}
      <button class="btn-primary" onclick='importAI(${JSON.stringify(actions)})' style="margin-top:14px;width:100%;">Import selected</button>`;}
  }catch(e){document.getElementById('aiResults').innerHTML='<p style="font-size:13px;color:var(--rag-r);padding:8px 0;">Could not extract. Please try again.</p>';}
  btn.disabled=false;btn.textContent='Extract actions';
}
async function importAI(actions){
  const cbs=document.querySelectorAll('[id^="ai_"]');
  const toSave=[];
  actions.forEach((a,i)=>{if(cbs[i]&&cbs[i].checked){const action={id:uid(),fn:a.fn||'sales',text:a.text,due:a.due||'',priority:a.priority||'Medium',rag:a.rag||'G',done:false};state.actions.push(action);toSave.push(action);}});
  saveLocal();closeAI();render();
  await Promise.all(toSave.map(a=>saveActionToSupabase(a)));
  showToast(`${toSave.length} action${toSave.length!==1?'s':''} imported`);
}

// ─── BOOT ─────────────────────────────────────────────────
document.getElementById('weekLabel').textContent=weekLabel();
loadFromSupabase();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
